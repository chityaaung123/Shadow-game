<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shadow Arena: Multiplayer Edition</title>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lobby -->
    <div id="lobby">
        <div class="dashboard-container">
            <div class="acc-card">
                <div>
                    <div style="font-size: 0.7rem; color: #94a3b8;">MY ID</div>
                    <div class="acc-id-txt" id="my-acc-id">Connecting...</div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button class="btn-sm" onclick="copyMyId()">Copy</button>
                    <button class="btn-sm" style="background: #a78bfa; color: white;" onclick="openAddFriendModal()">+ Friend</button>
                </div>
            </div>

            <div class="redeem-container">
                <input type="text" id="redeem-input" class="redeem-input" placeholder="Enter Redeem Code">
                <button class="btn-sm" onclick="applyRedeemCode()">Claim</button>
            </div>

            <div class="friend-drawer">
                <div class="friend-header">
                    <span class="friend-title">👥 FRIENDS LIST</span>
                    <span style="font-size:0.75rem; color:#94a3b8;" id="friend-count-txt">(0)</span>
                </div>
                <div class="friend-list" id="friend-list-ui"></div>
            </div>
        </div>

        <div class="title">Shadow Arena<br><span style="font-size:1rem; color:#a78bfa;">Multiplayer Survival</span></div>
        
        <div class="name-input-container">
            <input type="text" id="player-name" placeholder="Enter Name" maxlength="12">
        </div>

        <div class="save-info">
            <span id="lb-highwave">🏆 Top Wave: 1</span>
            <span id="lb-gold">🪙 Gold: 0</span>
        </div>

        <div class="hero-showcase">
            <div class="hero-avatar" id="disp-emoji">🤖</div>
            <div class="hero-name" id="disp-name">Robot (No Spell)</div>
            <button class="btn-change" onclick="openHeroModal()">Shop / Change Hero</button>
        </div>

        <div class="custom-section">
            <div class="color-title">Stickman Color</div>
            <div class="color-grid" id="color-grid"></div>

            <div class="color-title" style="margin-top: 8px;">Team Color (Black = Solo/PVP)</div>
            <div class="color-grid" id="team-grid"></div>
        </div>

        <div class="mode-container">
            <button class="btn-mode btn-offline" onclick="startOfflineGame()">Play Solo (Offline)</button>
            <button class="btn-mode btn-host" onclick="setupMultiplayerLobby(true)">Create Lobby</button>
            <button class="btn-mode btn-join" onclick="setupMultiplayerLobby(false)">Join Room</button>
            <button class="btn-mode btn-stats" onclick="openStatsModal()">STATS / UPGRADES</button>
        </div>
    </div>

    <!-- Invite Notification Pop-up -->
    <div id="invite-toast">
        <div id="invite-msg-txt" style="font-weight: bold; margin-bottom: 8px; color: #facc15;">Invited you to play!</div>
        <div style="display:flex; gap: 10px; justify-content: center;">
            <button class="btn-sm" style="background:#10b981; color:white; padding:6px 14px;" onclick="acceptGameInvite()">Accept</button>
            <button class="btn-sm" style="background:#ef4444; color:white; padding:6px 14px;" onclick="declineGameInvite()">Decline</button>
        </div>
    </div>

    <!-- Add Friend Modal -->
    <div id="add-friend-modal" class="modal-overlay">
        <div class="modal-content" style="max-width: 380px;">
            <h2 style="color: #38bdf8;">Add Friend</h2>
            <p style="font-size:0.8rem; color:#cbd5e1; margin: 8px 0;">Paste your friend's Account ID below:</p>
            <input type="text" id="friend-id-input" placeholder="Enter Account ID" style="padding: 10px; border-radius: 6px; border: 1px solid #38bdf8; width: 100%; background: #0f172a; color: white; text-align: center; font-weight: bold;">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-change" style="background:#10b981; flex:1;" onclick="confirmAddFriend()">Add</button>
                <button class="btn-change" style="background:#ef4444; flex:1;" onclick="hideModal('add-friend-modal')">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Multiplayer Lobby Modal -->
    <div id="mp-lobby-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="mp-title" style="color: #38bdf8;">Multiplayer Lobby</h2>
            <div id="mp-code-container" style="margin: 12px 0; font-size: 1.1rem; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 8px;">
                Room ID: <span id="room-code-txt" style="color: #facc15; font-weight: bold;">Generating...</span>
            </div>
            <div id="join-input-container" style="display: none; margin: 12px 0;">
                <input type="text" id="join-code-input" placeholder="Enter Room ID" style="padding: 8px; border-radius: 6px; border: 1px solid #475569; width: 80%; background: #0f172a; color: white; text-align: center; font-size: 1rem;">
                <button class="btn-change" style="margin-top: 8px; background: #3b82f6;" onclick="joinRoomSubmit()">Connect</button>
            </div>
            <p style="color: #cbd5e1; text-align: left; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem;">Connected Players:</p>
            <div class="players-list" id="mp-players-list"></div>
        </div>
    </div>

    <!-- Game Script -->
    <script src="Game.js"></script>

</body>
</html>
